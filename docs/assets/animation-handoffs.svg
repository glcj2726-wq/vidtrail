<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title"><title id="title">Handoffs and review points in the creator’s animation process</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9d6349"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1120" height="390" rx="18" fill="#faf6ed" stroke="none"/><text x="38" y="47" font-size="27" fill="#183c3b" font-weight="600"><tspan x="38" dy="0">What moves forward, and what the creator checks</tspan></text><rect x="36" y="91" width="232" height="181" rx="18" fill="#f0dfc9" stroke="none"/><text x="53" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="53" dy="0">Stable inputs</tspan></text><text x="53" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="53" dy="0">Narration and style trial</tspan><tspan x="53" dy="31">Creator sets direction</tspan></text><path d="M275 180H300" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="91" width="232" height="181" rx="18" fill="#e7ead8" stroke="none"/><text x="325" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="325" dy="0">Reviewed stills</tspan></text><text x="325" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="325" dy="0">Timing and key images</tspan><tspan x="325" dy="31">Creator checks meaning</tspan></text><path d="M547 180H572" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="91" width="232" height="181" rx="18" fill="#dfeae3" stroke="none"/><text x="597" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="597" dy="0">Revised animation</tspan></text><text x="597" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="597" dy="0">Comments and revisions</tspan><tspan x="597" dy="31">Update affected clips</tspan></text><path d="M819 180H844" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="852" y="91" width="232" height="181" rx="18" fill="#ecd9cf" stroke="none"/><text x="869" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="869" dy="0">Approved full cut</tspan></text><text x="869" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="869" dy="0">Sound and full review</tspan><tspan x="869" dy="31">Resolve issues, approve</tspan></text><rect x="36" y="300" width="1048" height="59" rx="12" fill="#fff" stroke="#d5cbbb"/><text x="57" y="336" font-size="18" fill="#183c3b" font-weight="400"><tspan x="57" dy="0">A keyframe edit affects adjacent clips; narration changes affect timing and later positions.</tspan></text></g></svg>

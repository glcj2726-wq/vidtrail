<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title"><title id="title">PDF与Markdown在书笔记中的不同用途</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9d6349"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1120" height="390" rx="18" fill="#faf6ed" stroke="none"/><text x="38" y="47" font-size="27" fill="#183c3b" font-weight="600"><tspan x="38" dy="0">同一次阅读，保留两种用途</tspan></text><rect x="36" y="76" width="502" height="176" rx="18" fill="#f0dfc9" stroke="none"/><rect x="582" y="76" width="502" height="176" rx="18" fill="#dfeae3" stroke="none"/><text x="60" y="113" font-size="27" fill="#183c3b" font-weight="600"><tspan x="60" dy="0">PDF</tspan></text><text x="606" y="113" font-size="27" fill="#183c3b" font-weight="600"><tspan x="606" dy="0">Markdown</tspan></text><text x="60" y="157" font-size="21" fill="#183c3b" font-weight="400"><tspan x="60" dy="0">保留导图的布局和图片</tspan><tspan x="60" dy="31">回看时找回原来的视觉关系</tspan></text><text x="606" y="157" font-size="21" fill="#183c3b" font-weight="400"><tspan x="606" dy="0">保留可编辑的大纲</tspan><tspan x="606" dy="31">继续添加概念链接、引文和行动项</tspan></text><path d="M288 254V278H834V254" fill="none" stroke="#9d6349" stroke-width="3"/><path d="M560 278V296" fill="none" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="302" width="740" height="60" rx="12" fill="#fff" stroke="#d5cbbb"/><text x="215" y="340" font-size="22" fill="#183c3b" font-weight="600"><tspan x="215" dy="0">单书笔记里写总结，并放入PDF和文字大纲</tspan></text></g></svg>

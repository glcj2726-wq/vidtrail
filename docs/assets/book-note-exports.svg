<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title"><title id="title">Different uses of PDF and Markdown in a book note</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9d6349"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1120" height="390" rx="18" fill="#faf6ed" stroke="none"/><text x="38" y="47" font-size="27" fill="#183c3b" font-weight="600"><tspan x="38" dy="0">One reading, two useful exports</tspan></text><rect x="36" y="76" width="502" height="176" rx="18" fill="#f0dfc9" stroke="none"/><rect x="582" y="76" width="502" height="176" rx="18" fill="#dfeae3" stroke="none"/><text x="60" y="113" font-size="27" fill="#183c3b" font-weight="600"><tspan x="60" dy="0">PDF</tspan></text><text x="606" y="113" font-size="27" fill="#183c3b" font-weight="600"><tspan x="606" dy="0">Markdown</tspan></text><text x="60" y="157" font-size="21" fill="#183c3b" font-weight="400"><tspan x="60" dy="0">Keep the map layout and images</tspan><tspan x="60" dy="31">Revisit the visual context</tspan></text><text x="606" y="157" font-size="21" fill="#183c3b" font-weight="400"><tspan x="606" dy="0">Keep an editable outline</tspan><tspan x="606" dy="31">Add concept links, quotes and actions</tspan></text><path d="M288 254V278H834V254" fill="none" stroke="#9d6349" stroke-width="3"/><path d="M560 278V296" fill="none" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="302" width="740" height="60" rx="12" fill="#fff" stroke="#d5cbbb"/><text x="215" y="340" font-size="22" fill="#183c3b" font-weight="600"><tspan x="215" dy="0">One book note: your summary + PDF + editable outline</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title"><title id="title">作者动画制作过程的交接和检查点</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9d6349"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1120" height="390" rx="18" fill="#faf6ed" stroke="none"/><text x="38" y="47" font-size="27" fill="#183c3b" font-weight="600"><tspan x="38" dy="0">每一步给下一步什么，作者在哪里作判断</tspan></text><rect x="36" y="91" width="232" height="181" rx="18" fill="#f0dfc9" stroke="none"/><text x="53" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="53" dy="0">输入稳定</tspan></text><text x="53" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="53" dy="0">旁白稿与风格小样</tspan><tspan x="53" dy="31">作者确认方向</tspan></text><path d="M275 180H300" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="308" y="91" width="232" height="181" rx="18" fill="#e7ead8" stroke="none"/><text x="325" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="325" dy="0">静帧通过</tspan></text><text x="325" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="325" dy="0">声音时间与关键画面</tspan><tspan x="325" dy="31">作者先看图意</tspan></text><path d="M547 180H572" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="91" width="232" height="181" rx="18" fill="#dfeae3" stroke="none"/><text x="597" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="597" dy="0">动画修改</tspan></text><text x="597" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="597" dy="0">按章批注与局部重渲</tspan><tspan x="597" dy="31">改动落到相关片段</tspan></text><path d="M819 180H844" stroke="#9d6349" stroke-width="3" marker-end="url(#arrow)"/><rect x="852" y="91" width="232" height="181" rx="18" fill="#ecd9cf" stroke="none"/><text x="869" y="129" font-size="21" fill="#183c3b" font-weight="600"><tspan x="869" dy="0">整片放行</tspan></text><text x="869" y="177" font-size="17" fill="#183c3b" font-weight="400"><tspan x="869" dy="0">声音合成与全片复看</tspan><tspan x="869" dy="31">问题处理后再发布</tspan></text><rect x="36" y="300" width="1048" height="59" rx="12" fill="#fff" stroke="#d5cbbb"/><text x="57" y="336" font-size="18" fill="#183c3b" font-weight="400"><tspan x="57" dy="0">修改关键帧时重渲相邻片段；旁白变长时调整覆盖段及后续位置。</tspan></text></g></svg>
